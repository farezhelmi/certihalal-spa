<section class="hero">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-lg-6 hero-text">
                <h1 class="headline">{{ heroData?.title }}</h1>
                <p class="subheading">{{ heroData?.subtitle }}</p>
                <a href="#contact" class="btn-primary cta-button">{{ heroData?.button_text }}</a>
            </div>
            <div class="col-lg-6 hero-image">
                <div class="image-wrapper">
                  <img src="{{ heroData?.background_image }}" alt="Halal Certification Training" class="img-fluid">
                </div>
            </div>
        </div>
    </div>
    <div class="hero-overlay"></div>
    <div class="hero-wave">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320">
            <path fill="#ffffff" fill-opacity="1" d="M0,96L48,112C96,128,192,160,288,160C384,160,480,128,576,122.7C672,117,768,139,864,133.3C960,128,1056,96,1152,96C1248,96,1344,128,1392,144L1440,160L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
        </svg>
    </div>
</section>
